make_labels:
  raw_dir: data/wbc_multifocus
  labels_csv: data/labels.csv
  split_dir: data/splits
  figure_dir: outputs/figures

  brenner_shift: 2
  focus_method: max
  quadratic_window: 5
  z_step_um: 0.4

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

dataset:
  target_column: defocus_position
  target_unit: µm
  image_size: 672
  channels: 3
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: mobilenet_v3_small
  pretrained: true
  output_dim: 1

train:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  batch_size: 16
  epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  loss: smooth_l1
  num_workers: 4
  seed: 42
  device: mps
  save_dir: outputs/checkpoints
  log_csv: outputs/logs/train_log.csv
  best_model_name: best_model.pth
  last_model_name: last_model.pth
  sign_epsilon: 0.0

eval:
  test_csv: data/splits/test.csv
  checkpoint: outputs/checkpoints/best_model-100epoch.pth
  batch_size: 16
  num_workers: 4
  device: auto
  output_dir: outputs
  predictions_csv: outputs/predictions/test_predictions.csv
  pred_vs_true_fig: outputs/figures/pred_vs_true.png
  error_hist_fig: outputs/figures/error_histogram.png
  error_vs_defocus_fig: outputs/eval/prediction_error_vs_defocus.png
  error_vs_detail_fig: outputs/eval/prediction_error_vs_brenner.png
  error_vs_defocus_stats_csv: outputs/eval/prediction_error_vs_defocus_stats.csv
  error_vs_detail_stats_csv: outputs/eval/prediction_error_vs_brenner_stats.csv
  detail_score_column: brenner_score
  analysis_num_bins: 10
  analysis_min_bin_samples: 3
  detail_x_log_scale: false
  plot_dpi: 300
  sign_epsilon: 0.0

predict:
  checkpoint: outputs/checkpoints/best_model.pth
  device: auto
  output_csv: outputs/predictions/predictions.csv
